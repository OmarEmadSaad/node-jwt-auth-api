# Publishes client/ to GitHub Pages.
# Manual only: run it from the repo's Actions tab ("Deploy client to GitHub Pages" > Run workflow).
# It compiles client/src/*.ts into client/js/ first. Before running it, set API_BASE_URL
# in client/src/config.ts to the deployed backend, and in the repo
# settings choose Pages > Source: GitHub Actions.
name: Deploy client to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client
      - id: deployment
        uses: actions/deploy-pages@v4
